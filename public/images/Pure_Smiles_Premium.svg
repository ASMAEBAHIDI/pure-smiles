<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="toothMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dff6ff"/>
      <stop offset="45%" stop-color="#7ccfff"/>
      <stop offset="100%" stop-color="#1f9cf5"/>
    </linearGradient>

    <linearGradient id="toothShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003ecb"/>
      <stop offset="100%" stop-color="#1b7cff"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offset"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Premium Tooth -->
  <g transform="translate(70,40)" filter="url(#shadow)">
    <path d="
      M350 110
      C220 110 130 220 130 360
      C130 500 210 610 230 760
      C238 825 300 835 315 770
      C335 675 345 575 430 575
      C515 575 525 675 545 770
      C560 835 622 825 630 760
      C650 610 730 500 730 360
      C730 220 640 110 510 110
      C465 110 450 135 430 135
      C410 135 395 110 350 110 Z"
      fill="url(#toothMain)"
      stroke="#3baef7"
      stroke-width="10"/>

    <path d="
      M235 180
      C185 240 175 330 205 470
      C225 560 270 620 340 660
      C300 560 290 450 220 360
      C190 320 190 240 235 180 Z"
      fill="url(#toothShine)"/>
  </g>

  <!-- Sparkle -->
  <g transform="translate(610,250)">
    <path d="M0 -55 L10 -10 L55 0 L10 10 L0 55 L-10 10 L-55 0 L-10 -10 Z"
          fill="#ffffff"/>
  </g>

  <!-- Brand -->
  <text x="760" y="390"
        font-family="Poppins, Arial, sans-serif"
        font-size="180"
        font-weight="300"
        fill="url(#brandBlue)">Pure</text>

  <text x="760" y="610"
        font-family="Poppins, Arial, sans-serif"
        font-size="210"
        font-weight="500"
        fill="url(#brandBlue)">Smiles</text>

  <text x="765" y="700"
        font-family="Arial, sans-serif"
        font-size="42"
        letter-spacing="4"
        fill="#41b4ff">
        HEALTHY SMILES, PURE CONFIDENCE
  </text>
</svg>
